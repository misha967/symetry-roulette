<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYMETRY — ROULETTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080808;--surface:#111111;--surface2:#1a1a1a;--border:#2a2a2a;
      --silver:#c8c8c8;--white:#ffffff;--dim:#666666;
      --red:#c0392b;--red-lit:#e74c3c;--green:#1a6b3a;--green-lit:#27ae60;
      --font-display:'Cormorant Garamond',serif;--font-mono:'Space Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;background:var(--bg);color:var(--white);font-family:var(--font-mono);overflow:hidden;}

    /* LOADING */
    #loading-screen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:28px;}
    .loading-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:translateY(20px);animation:logoReveal 1s cubic-bezier(0.22,1,0.36,1) forwards;}
    @keyframes logoReveal{to{opacity:1;transform:translateY(0);}}
    .loading-sub{font-size:0.55rem;letter-spacing:0.35em;color:var(--dim);text-transform:uppercase;}
    .loading-bar-wrap{width:200px;display:flex;flex-direction:column;gap:8px;align-items:center;opacity:0;animation:fadeIn 0.5s 0.8s forwards;}
    @keyframes fadeIn{to{opacity:1;}}
    .loading-bar{width:100%;height:1px;background:#222;position:relative;overflow:hidden;}
    .loading-bar-fill{position:absolute;left:0;top:0;height:100%;background:var(--silver);width:0%;transition:width 0.3s ease;box-shadow:0 0 8px var(--silver);}
    .loading-pct{font-size:0.6rem;letter-spacing:0.2em;color:var(--dim);}
    .loading-step{font-size:0.55rem;letter-spacing:0.15em;color:#333;text-transform:uppercase;min-height:14px;}
    #loading-screen.done{animation:loadFadeOut 0.6s 0.3s ease forwards;}
    @keyframes loadFadeOut{to{opacity:0;pointer-events:none;}}

    /* GAME */
    #game-screen{display:none;flex-direction:column;height:100dvh;overflow:hidden;}

    /* TOP BAR */
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .top-logo{display:flex;align-items:center;gap:10px;}
    .top-logo-text{font-family:var(--font-display);font-size:1.1rem;font-weight:300;letter-spacing:0.4em;color:#fff;text-transform:uppercase;}
    .top-right{display:flex;align-items:center;gap:10px;}
    .balance-label{font-size:0.5rem;letter-spacing:0.2em;color:var(--dim);text-transform:uppercase;}
    .balance-value{font-size:0.95rem;font-weight:700;color:#fff;}

    /* Hamburger */
    #menu-btn{background:none;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:7px 8px;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;}
    #menu-btn:hover{border-color:#555;color:#fff;}
    .ham-line{width:16px;height:1.5px;background:currentColor;border-radius:2px;}

    /* MENU DRAWER */
    #menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;opacity:0;pointer-events:none;transition:opacity 0.25s;}
    #menu-overlay.open{opacity:1;pointer-events:all;}
    #menu-drawer{position:fixed;top:0;right:0;bottom:0;width:280px;background:#111;border-left:1px solid var(--border);z-index:501;transform:translateX(100%);transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column;overflow-y:auto;}
    #menu-drawer.open{transform:translateX(0);}
    .drawer-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .drawer-title{font-family:var(--font-display);font-size:1.2rem;font-weight:300;letter-spacing:0.3em;color:#fff;text-transform:uppercase;}
    #drawer-close{background:none;border:none;color:var(--dim);font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;transition:color 0.15s;}
    #drawer-close:hover{color:#fff;}
    .drawer-section{padding:18px 20px;border-bottom:1px solid var(--border);}
    .drawer-section-label{font-size:0.5rem;letter-spacing:0.25em;color:var(--dim);text-transform:uppercase;margin-bottom:12px;}

    /* Sound toggle */
    .sound-row{display:flex;align-items:center;justify-content:space-between;}
    .sound-label{font-size:0.75rem;color:var(--silver);}
    .toggle-switch{position:relative;width:44px;height:24px;cursor:pointer;display:inline-block;}
    .toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
    .toggle-track{position:absolute;inset:0;background:#333;border-radius:12px;transition:background 0.2s;}
    .toggle-knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#666;border-radius:50%;transition:all 0.2s;}
    .toggle-switch input:checked ~ .toggle-track{background:#fff;}
    .toggle-switch input:checked ~ .toggle-knob{transform:translateX(20px);background:#000;}

    /* Lang / currency */
    .lang-grid,.currency-grid{display:flex;flex-direction:column;gap:4px;}
    .lang-btn,.currency-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--dim);font-family:var(--font-mono);font-size:0.72rem;transition:all 0.12s;text-align:left;width:100%;}
    .lang-btn:hover,.currency-btn:hover{background:var(--surface2);color:var(--silver);}
    .lang-btn.active,.currency-btn.active{background:var(--surface2);border-color:#444;color:#fff;}
    .lang-flag,.currency-flag{font-size:1.1rem;line-height:1;}
    .currency-symbol{font-weight:700;color:var(--silver);min-width:20px;}

    /* WHEEL */
    .wheel-section{flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:10px 0 6px;background:var(--bg);}
    #wheel-canvas{display:block;}

    /* WIN STRIP */
    .win-strip{display:flex;align-items:center;justify-content:center;gap:12px;padding:5px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;min-height:32px;}
    #win-number-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:0.75rem;font-weight:700;flex-shrink:0;opacity:0;transition:all 0.3s;}
    #win-number-badge.visible{opacity:1;}
    #win-message{font-size:0.75rem;color:var(--dim);min-width:120px;}
    #win-message.won{color:#fff;}
    #win-message.lost{color:#444;}
    #last-net{font-family:var(--font-mono);font-size:0.8rem;font-weight:700;}
    #last-net.pos{color:#fff;}
    #last-net.neg{color:#444;}

    /* TABLE */
    .table-section{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px;background:var(--bg);display:flex;flex-direction:column;gap:5px;scrollbar-width:none;align-items:stretch;}
    .table-section::-webkit-scrollbar{display:none;}
    .zero-row{display:flex;gap:3px;}
    .zero-cell{flex:1;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:0.9rem;font-weight:700;cursor:pointer;background:var(--green);color:#fff;transition:all 0.15s;position:relative;user-select:none;}
    .zero-cell:active{transform:scale(0.96);}
    .zero-cell.selected{outline:2px solid #fff;outline-offset:1px;}
    .number-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:100%;}
    .num-cell{height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.12s;position:relative;user-select:none;}
    .num-cell.red-num{background:var(--red);color:#fff;}
    .num-cell.black-num{background:#1e1e1e;color:var(--silver);border:1px solid #333;}
    .num-cell:active{transform:scale(0.93);}
    .num-cell.selected{outline:2px solid #fff;outline-offset:1px;}
    .num-cell.winning{animation:winPulse 0.8s ease 3;}
    @keyframes winPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);box-shadow:0 0 12px rgba(255,255,255,0.6);}}
    .outside-row{display:flex;gap:3px;}
    .outside-cell{flex:1;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:0.64rem;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--silver);border:1px solid var(--border);transition:all 0.12s;user-select:none;white-space:nowrap;padding:0 2px;}
    .outside-cell:active{transform:scale(0.96);}
    .outside-cell.selected{background:var(--border);color:#fff;border-color:#666;}
    .outside-cell.red-cell{background:#2a0a0a;color:#e74c3c;border-color:#5a1a1a;}
    .outside-cell.red-cell.selected{background:var(--red);color:#fff;border-color:#e74c3c;}
    .outside-cell.black-cell{background:#111;color:var(--silver);border-color:#333;}
    .outside-cell.black-cell.selected{background:#333;color:#fff;border-color:#666;}
    .grid-with-columns{display:flex;gap:3px;}
    .column-bets{display:flex;flex-direction:column;gap:3px;width:38px;flex-shrink:0;}
    .col-cell{flex:1;border-radius:6px;text-align:center;line-height:1.2;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:0.58rem;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--silver);border:1px solid var(--border);transition:all 0.12s;user-select:none;}
    .col-cell:active{transform:scale(0.96);}
    .col-cell.selected{background:var(--border);color:#fff;border-color:#666;}
    .chip-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;z-index:2;}

    /* CONTROLS */
    .controls{flex-shrink:0;padding:10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;background:var(--surface);}
    .chip-selector{display:flex;gap:4px;flex-wrap:wrap;}
    .chip-btn{padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-family:var(--font-mono);font-size:0.68rem;cursor:pointer;transition:all 0.12s;white-space:nowrap;}
    .chip-btn.active{background:#fff;color:#000;border-color:#fff;}
    .chip-btn:active{transform:scale(0.95);}
    .action-row{display:flex;gap:6px;}
    #spin-btn{flex:1;padding:13px;border-radius:10px;border:none;background:#fff;color:#000;font-family:var(--font-display);font-size:1.1rem;font-weight:600;letter-spacing:0.15em;cursor:pointer;transition:all 0.15s;text-transform:uppercase;}
    #spin-btn:disabled{background:var(--border);color:var(--dim);cursor:not-allowed;}
    #spin-btn:active:not(:disabled){transform:scale(0.97);}
    #clear-btn,#rebet-btn{padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-family:var(--font-mono);font-size:0.7rem;cursor:pointer;transition:all 0.15s;}
    #clear-btn:active,#rebet-btn:active{transform:scale(0.97);}
    .bets-summary{font-size:0.65rem;color:var(--dim);text-align:right;min-height:14px;}
    .bets-summary span{color:var(--silver);}

    @media(max-width:430px){
      .controls{padding:8px 10px;gap:6px;}
      .chip-btn{padding:5px 8px;font-size:0.62rem;}
      #spin-btn{font-size:1rem;padding:12px;}
      .num-cell{height:36px;}
      .zero-cell{height:36px;}
      .outside-cell{height:32px;font-size:0.6rem;}
    }
    ::-webkit-scrollbar{display:none;}
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo-wrap">
    <img src="logo.JPG" alt="Symetry" style="width:160px;height:160px;object-fit:contain;filter:brightness(1.1);">
    <div class="loading-sub">Casino Games Studio</div>
  </div>
  <div class="loading-bar-wrap">
    <div class="loading-bar"><div class="loading-bar-fill" id="loading-fill"></div></div>
    <div class="loading-pct" id="loading-pct">0%</div>
    <div class="loading-step" id="loading-step">Initialisation</div>
  </div>
</div>

<div id="game-screen">
  <div class="top-bar">
    <div class="top-logo">
      <img src="logo.JPG" alt="Symetry" style="width:28px;height:28px;object-fit:contain;">
      <span class="top-logo-text">Roulette</span>
    </div>
    <div class="top-right">
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px;">
        <span class="balance-label" data-i18n="balance">Solde</span>
        <span class="balance-value" id="balance-val">1 000 $</span>
      </div>
      <button id="menu-btn" onclick="openMenu()">
        <div class="ham-line"></div>
        <div class="ham-line"></div>
        <div class="ham-line"></div>
      </button>
    </div>
  </div>

  <div class="wheel-section" id="wheel-section">
    <canvas id="wheel-canvas"></canvas>
  </div>

  <div class="win-strip">
    <div id="win-number-badge"></div>
    <div id="win-message" data-i18n="placeBets">Placez vos mises</div>
    <div id="last-net"></div>
  </div>

  <div class="table-section">
    <div class="zero-row">
      <div class="zero-cell num-cell" data-number="0" onclick="toggleStraight(0)">0</div>
    </div>
    <div class="grid-with-columns">
      <div class="number-grid" id="number-grid"></div>
      <div class="column-bets">
        <div class="col-cell" data-col="3" onclick="toggleColumn(3)">Col<br>3</div>
        <div class="col-cell" data-col="2" onclick="toggleColumn(2)">Col<br>2</div>
        <div class="col-cell" data-col="1" onclick="toggleColumn(1)">Col<br>1</div>
      </div>
    </div>
    <div class="outside-row">
      <div class="outside-cell" data-dozen="1" onclick="toggleDozen(1)">1-12</div>
      <div class="outside-cell" data-dozen="2" onclick="toggleDozen(2)">13-24</div>
      <div class="outside-cell" data-dozen="3" onclick="toggleDozen(3)">25-36</div>
    </div>
    <div class="outside-row">
      <div class="outside-cell" data-bet="low"   onclick="toggleOutside('low')"   data-i18n="low">1-18</div>
      <div class="outside-cell" data-bet="even"  onclick="toggleOutside('even')"  data-i18n="even">Pair</div>
      <div class="outside-cell red-cell"   data-bet="red"   onclick="toggleOutside('red')"   data-i18n="red">Rouge</div>
      <div class="outside-cell black-cell" data-bet="black" onclick="toggleOutside('black')" data-i18n="black">Noir</div>
      <div class="outside-cell" data-bet="odd"   onclick="toggleOutside('odd')"   data-i18n="odd">Impair</div>
      <div class="outside-cell" data-bet="high"  onclick="toggleOutside('high')"  data-i18n="high">19-36</div>
    </div>
  </div>

  <div class="controls">
    <div class="chip-selector" id="chip-selector"></div>
    <div class="action-row">
      <button id="clear-btn" onclick="clearBets()">✕ Effacer</button>
      <button id="spin-btn"  onclick="doSpin()">SPIN</button>
      <button id="rebet-btn" onclick="rebet()">&#x21BA; Remiser</button>
    </div>
    <div class="bets-summary" id="bets-summary"></div>
  </div>
</div>

<div id="menu-overlay" onclick="closeMenu()"></div>
<div id="menu-drawer">
  <div class="drawer-header">
    <span class="drawer-title" data-i18n="menu">Menu</span>
    <button id="drawer-close" onclick="closeMenu()">&#x2715;</button>
  </div>
  <div class="drawer-section">
    <div class="drawer-section-label" data-i18n="sound">Son</div>
    <div class="sound-row">
      <span class="sound-label" id="sound-label">Off</span>
      <label class="toggle-switch">
        <input type="checkbox" id="sound-toggle" onchange="onSoundToggle(this.checked)">
        <div class="toggle-track"></div>
        <div class="toggle-knob"></div>
      </label>
    </div>
  </div>
  <div class="drawer-section">
    <div class="drawer-section-label" data-i18n="language">Langue</div>
    <div class="lang-grid" id="lang-grid"></div>
  </div>
  <div class="drawer-section">
    <div class="drawer-section-label" data-i18n="currency">Devise</div>
    <div class="currency-grid" id="currency-grid"></div>
  </div>
</div>

<script src="roulette-config.js"></script>
<script src="roulette-bets.js"></script>
<script src="roulette-math.js"></script>
<script src="roulette-wheel.js"></script>
<script>
const RM  = window.RouletteMath;
const CFG  = window.RouletteConfig;
const BETS = window.RouletteBets;

// ── STATE ──
let balance      = parseFloat(localStorage.getItem('symetry_roulette_balance') || '1000');
let chipValue    = BETS.chipsFor('USD')[0];
let bets         = [];
let lastBets     = [];
let spinning     = false;
let soundEnabled = false;
let betIdCounter = 0;
let currentLang     = localStorage.getItem('symetry_lang')     || 'fr';
let currentCurrency = localStorage.getItem('symetry_currency') || 'USD';

function t(key) { return (CFG.i18n[currentLang] || CFG.i18n.fr)[key] || key; }
function getCurrency() { return CFG.currencies.find(c => c.code === currentCurrency) || CFG.currencies[0]; }
function formatAmount(n) { return n.toLocaleString('fr-FR', {maximumFractionDigits:0}) + ' ' + getCurrency().symbol; }

// ── BALANCE ──
function saveBalance() { localStorage.setItem('symetry_roulette_balance', balance.toFixed(2)); }
function updateBalanceUI() { document.getElementById('balance-val').textContent = formatAmount(balance); }

// ── SOUND LABEL ──
const SOUND_ON  = {fr:'Activé', en:'On',   pt:'Ativado',   es:'Activado',   sw:'Imewashwa'};
const SOUND_OFF = {fr:'Désactivé', en:'Off', pt:'Desativado', es:'Desactivado', sw:'Imezimwa'};
function soundLabel() { return soundEnabled ? (SOUND_ON[currentLang]||'On') : (SOUND_OFF[currentLang]||'Off'); }

// ── I18N ──
function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('clear-btn').textContent = t('clear');
  document.getElementById('spin-btn').textContent  = t('spin');
  document.getElementById('rebet-btn').textContent = t('rebet');
  document.querySelectorAll('[data-col]').forEach(el => { el.innerHTML = t('col') + '<br>' + el.dataset.col; });
  document.getElementById('sound-label').textContent = soundLabel();
  updateBalanceUI();
  updateBetsSummary();
  const msg = document.getElementById('win-message');
  if (!msg.classList.contains('won') && !msg.classList.contains('lost')) msg.textContent = t('placeBets');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  document.querySelectorAll('.currency-btn').forEach(b => b.classList.toggle('active', b.dataset.currency === currentCurrency));
}

// ── LOADING ──
const loadingSteps = [[20,'Chargement des assets'],[45,'Construction de la roue'],[70,'Vérification du RTP'],[90,'Mise en place de la table'],[100,'Prêt']];
let loadIdx = 0;
function advanceLoading() {
  if (loadIdx >= loadingSteps.length) return;
  const [pct, step] = loadingSteps[loadIdx++];
  document.getElementById('loading-fill').style.width = pct + '%';
  document.getElementById('loading-pct').textContent  = pct + '%';
  document.getElementById('loading-step').textContent = step;
  if (loadIdx < loadingSteps.length) setTimeout(advanceLoading, 300 + Math.random()*200);
  else setTimeout(startGame, 500);
}
setTimeout(advanceLoading, 900);

function startGame() {
  document.getElementById('loading-screen').classList.add('done');
  setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 900);
  document.getElementById('game-screen').style.display = 'flex';
  buildMenu();
  setTimeout(() => { buildNumberGrid(); buildChips(); initWheel(); applyTranslations(); }, 100);
  updateBalanceUI();
}

// ── MENU ──
function buildMenu() {
  const langGrid = document.getElementById('lang-grid');
  CFG.languages.forEach(lang => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (lang.code === currentLang ? ' active' : '');
    btn.dataset.lang = lang.code;
    btn.innerHTML = `<span class="lang-flag">${lang.flag}</span><span>${lang.label}</span>`;
    btn.onclick = () => setLanguage(lang.code);
    langGrid.appendChild(btn);
  });
  const curGrid = document.getElementById('currency-grid');
  CFG.currencies.forEach(cur => {
    const btn = document.createElement('button');
    btn.className = 'currency-btn' + (cur.code === currentCurrency ? ' active' : '');
    btn.dataset.currency = cur.code;
    btn.innerHTML = `<span class="currency-flag">${cur.flag}</span><span class="currency-symbol">${cur.symbol}</span><span>${cur.name}</span>`;
    btn.onclick = () => setCurrency(cur.code);
    curGrid.appendChild(btn);
  });
}

function openMenu()  { document.getElementById('menu-overlay').classList.add('open'); document.getElementById('menu-drawer').classList.add('open'); }
function closeMenu() { document.getElementById('menu-overlay').classList.remove('open'); document.getElementById('menu-drawer').classList.remove('open'); }
function setLanguage(code) { currentLang = code; localStorage.setItem('symetry_lang', code); applyTranslations(); }
function setCurrency(code) { currentCurrency = code; localStorage.setItem('symetry_currency', code); buildChips(); applyTranslations(); }

// ── WHEEL ──
function initWheel() { RouletteWheel.init(document.getElementById('wheel-canvas'), document.getElementById('wheel-section')); }
function spinWheel(winNumber, onDone) { RouletteWheel.spin(winNumber, onDone, playWinSound); }

// ── CHIPS ──
function buildChips() {
  const sel = document.getElementById('chip-selector');
  sel.innerHTML = '';
  const cur = getCurrency();
  const chips = BETS.chipsWithLabel(cur.code, cur.symbol);
  chips.forEach((chip, i) => {
    const btn = document.createElement('button');
    btn.className = 'chip-btn' + (i === 0 ? ' active' : '');
    btn.dataset.value = chip.converted;
    btn.dataset.eur = chip.eur;
    btn.textContent = chip.label;
    btn.onclick = () => selectChip(chip.converted);
    sel.appendChild(btn);
  });
  chipValue = chips[0].converted;
}
function rebuildChipLabels() {
  const cur = getCurrency();
  const chips = BETS.chipsWithLabel(cur.code, cur.symbol);
  document.querySelectorAll('.chip-btn').forEach((b, i) => {
    if (chips[i]) {
      b.dataset.value = chips[i].converted;
      b.textContent = chips[i].label;
    }
  });
  // Reset chipValue to first chip of new currency
  chipValue = chips[0].converted;
  selectChip(chips[0].converted);
}
function selectChip(val) {
  chipValue = val;
  document.querySelectorAll('.chip-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.value) === val));
}

// ── BET TABLE ──
function buildNumberGrid() {
  const grid = document.getElementById('number-grid');
  grid.innerHTML = '';
  for (let row = 3; row >= 1; row--) {
    for (let col = 1; col <= 12; col++) {
      const num = (col-1)*3 + row;
      const cell = document.createElement('div');
      cell.className = `num-cell ${RM.isRed(num) ? 'red-num' : 'black-num'}`;
      cell.dataset.number = num;
      cell.textContent = num;
      cell.onclick = () => toggleStraight(num);
      grid.appendChild(cell);
    }
  }
}

function toggleStraight(num) {
  const key = `straight_${num}`, ex = bets.find(b => b.key === key);
  if (ex) ex.amount += chipValue;
  else bets.push({type:'straight', numbers:[num], amount:chipValue, key, id:betIdCounter++});
  updateTableUI(); updateBetsSummary();
}
function toggleDozen(d) {
  const key = `dozen_${d}`, nums = Array.from({length:12},(_,i)=>(d-1)*12+i+1), ex = bets.find(b => b.key===key);
  if (ex) ex.amount += chipValue;
  else bets.push({type:'dozen', numbers:nums, amount:chipValue, key, id:betIdCounter++});
  updateTableUI(); updateBetsSummary();
}
function toggleColumn(c) {
  const key = `column_${c}`, nums = [], ex = bets.find(b => b.key===key);
  for (let i=0;i<12;i++) nums.push(i*3+c);
  if (ex) ex.amount += chipValue;
  else bets.push({type:'column', numbers:nums, amount:chipValue, key, id:betIdCounter++});
  updateTableUI(); updateBetsSummary();
}
function toggleOutside(betType) {
  const key = `outside_${betType}`; let nums;
  switch(betType){
    case 'red':   nums=[...RM.RED_NUMBERS]; break;
    case 'black': nums=Array.from({length:36},(_,i)=>i+1).filter(n=>!RM.isRed(n)); break;
    case 'even':  nums=Array.from({length:18},(_,i)=>(i+1)*2); break;
    case 'odd':   nums=Array.from({length:18},(_,i)=>i*2+1); break;
    case 'low':   nums=Array.from({length:18},(_,i)=>i+1); break;
    case 'high':  nums=Array.from({length:18},(_,i)=>i+19); break;
  }
  const ex = bets.find(b => b.key===key);
  if (ex) ex.amount += chipValue;
  else bets.push({type:betType, numbers:nums, amount:chipValue, key, id:betIdCounter++});
  updateTableUI(); updateBetsSummary();
}

function updateTableUI() {
  document.querySelectorAll('.chip-dot').forEach(d => d.remove());
  document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
  bets.forEach(bet => {
    let cell = null;
    if (bet.type==='straight') cell = document.querySelector(`[data-number="${bet.numbers[0]}"]`);
    else if (bet.type==='dozen') cell = document.querySelector(`[data-dozen="${Math.ceil(bet.numbers[0]/12)}"]`);
    else if (bet.type==='column') cell = document.querySelector(`[data-col="${((bet.numbers[0]-1)%3)+1}"]`);
    else cell = document.querySelector(`[data-bet="${bet.type}"]`);
    if (cell) {
      cell.classList.add('selected');
      const dot = document.createElement('div');
      dot.className = 'chip-dot';
      dot.title = formatAmount(bet.amount);
      if (bet.amount > chipValue) {
        dot.style.cssText = 'width:14px;height:14px;font-size:7px;color:#000;display:flex;align-items:center;justify-content:center;';
        dot.textContent = bet.amount >= 100 ? Math.floor(bet.amount/100)+'C' : bet.amount;
      }
      cell.appendChild(dot);
    }
  });
}

function updateBetsSummary() {
  const total = bets.reduce((s,b)=>s+b.amount, 0);
  const el = document.getElementById('bets-summary');
  if (total === 0) { el.textContent = ''; return; }
  const label = bets.length > 1 ? t('betsPlural') : t('bets');
  el.innerHTML = `${bets.length} ${label} — ${t('total')} : <span>${formatAmount(total)}</span>`;
  document.getElementById('spin-btn').disabled = false;
}

function clearBets() {
  bets = []; updateTableUI(); updateBetsSummary();
  document.getElementById('spin-btn').disabled = false;
  document.getElementById('win-message').textContent = t('placeBets');
  document.getElementById('win-message').className = '';
  document.getElementById('last-net').textContent = '';
  document.getElementById('win-number-badge').classList.remove('visible');
}

function rebet() {
  if (!lastBets.length) return;
  bets = lastBets.map(b => ({...b, id:betIdCounter++}));
  updateTableUI(); updateBetsSummary();
}

// ── SPIN ──
function doSpin() {
  if (spinning) return;
  if (bets.length === 0) {
    const msg = document.getElementById('win-message');
    msg.textContent = '⚠️ ' + t('placFirst'); msg.className = 'lost';
    setTimeout(() => { msg.textContent = t('placeBets'); msg.className = ''; }, 2500);
    return;
  }
  const total = bets.reduce((s,b)=>s+b.amount, 0);
  if (total > balance) { document.getElementById('win-message').textContent = t('insufficiant'); return; }

  spinning = true;
  balance = parseFloat((balance - total).toFixed(2));
  saveBalance(); updateBalanceUI();
  lastBets = bets.map(b => ({...b}));
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('win-message').textContent = t('goodLuck');
  document.getElementById('win-message').className = '';
  document.getElementById('last-net').textContent = '';
  document.getElementById('win-number-badge').classList.remove('visible');

  const winNumber = RM.spin();
  playSpinSound();

  spinWheel(winNumber, () => {
    const { totalNet, results } = RM.evaluateSpin(bets, winNumber);
    balance = parseFloat((balance + totalNet).toFixed(2));
    saveBalance(); updateBalanceUI();

    const info = RM.numberInfo(winNumber);
    const badge = document.getElementById('win-number-badge');
    badge.textContent = winNumber;
    badge.style.background = info.color==='green' ? 'var(--green-lit)' : info.color==='red' ? 'var(--red-lit)' : '#333';
    badge.style.color = '#fff';
    badge.classList.add('visible');
    highlightWinning(winNumber);

    const msgEl = document.getElementById('win-message');
    const netEl = document.getElementById('last-net');
    const anyWon = results.some(r => r.won);
    if (anyWon) {
      msgEl.textContent = `${t('number')} ${winNumber} — ${t('won')}`;
      msgEl.className = 'won';
      netEl.textContent = '+' + formatAmount(totalNet - total);
      netEl.className = 'pos';
      showWinPopup(winNumber, totalNet, total);
    } else {
      msgEl.textContent = `${t('number')} ${winNumber} — ${t('lost')}`;
      msgEl.className = 'lost';
      netEl.textContent = '-' + formatAmount(total);
      netEl.className = 'neg';
    }
    spinning = false;
    document.getElementById('spin-btn').disabled = false;
    bets = []; updateTableUI(); updateBetsSummary();
  });
}

function highlightWinning(num) {
  document.querySelectorAll(`[data-number="${num}"]`).forEach(c => {
    c.classList.add('winning');
    setTimeout(() => c.classList.remove('winning'), 2400);
  });
}

function showWinPopup(winNumber, totalWin, betsTotal) {
  const ex = document.getElementById('win-popup');
  if (ex) ex.remove();
  const profit = totalWin - betsTotal;
  const info = RM.numberInfo(winNumber);
  const bgColor = info.color==='green' ? '#1a6b3a' : info.color==='red' ? '#8b1a1a' : '#1a1a1a';
  const isJackpot = profit >= betsTotal * 10, isBig = profit >= betsTotal * 3;
  const popup = document.createElement('div');
  popup.id = 'win-popup';
  popup.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.7);opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:600;text-align:center;pointer-events:none;background:#0e0e0e;border:1px solid #333;border-radius:18px;padding:28px 40px;min-width:240px;box-shadow:0 0 50px rgba(255,255,255,0.06);';
  popup.innerHTML = `
    <div style="font-size:0.55rem;letter-spacing:0.35em;color:#555;text-transform:uppercase;margin-bottom:10px;">${isJackpot ? t('jackpot') : '✦ ' + t('gain')}</div>
    <div style="display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
      <div style="width:36px;height:36px;border-radius:50%;background:${bgColor};border:1px solid #555;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:0.8rem;font-weight:700;color:#fff;">${winNumber}</div>
    </div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:600;color:#fff;line-height:1;margin-bottom:6px;">+${formatAmount(profit)}</div>
    <div style="font-family:'Space Mono',monospace;font-size:0.65rem;color:#555;letter-spacing:0.1em;">${t('totalReturn')} : ${formatAmount(totalWin)}</div>
  `;
  document.body.appendChild(popup);
  requestAnimationFrame(() => { popup.style.opacity='1'; popup.style.transform='translate(-50%,-50%) scale(1)'; });
  const delay = isJackpot ? 3500 : isBig ? 2800 : 2200;
  setTimeout(() => {
    popup.style.transition='opacity 0.4s,transform 0.4s'; popup.style.opacity='0'; popup.style.transform='translate(-50%,-50%) scale(0.9)';
    setTimeout(() => popup.remove(), 450);
  }, delay);
}

// ── AUDIO ──
let audioCtx=null, musicPlaying=false, musicScheduler=null, musicNodes=[];
const NOTE = n => 440 * Math.pow(2, n/12);
const chords = [[NOTE(-7),NOTE(-2),NOTE(2),NOTE(5)],[NOTE(-12),NOTE(-5),NOTE(-2),NOTE(3)],[NOTE(-14),NOTE(-7),NOTE(-2),NOTE(2)],[NOTE(-17),NOTE(-10),NOTE(-5),NOTE(0)],[NOTE(-22),NOTE(-15),NOTE(-10),NOTE(-5)],[NOTE(-7),NOTE(-2),NOTE(3),NOTE(7)]];
const bass = [NOTE(-31),NOTE(-36),NOTE(-38),NOTE(-43),NOTE(-46),NOTE(-31)];
const CHORD_DUR = 3.2;
function getACtx() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function makePad(ctx,freq,t,dur,vol){const osc=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();osc.type='triangle';osc.frequency.value=freq;osc.detune.value=(Math.random()-.5)*8;f.type='lowpass';f.frequency.value=750;f.Q.value=1.5;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.7);g.gain.setValueAtTime(vol,t+dur-0.8);g.gain.linearRampToValueAtTime(0,t+dur+0.5);osc.connect(f);f.connect(g);g.connect(ctx.destination);osc.start(t);osc.stop(t+dur+0.7);musicNodes.push(osc,g,f);}
function makeBass(ctx,freq,t,dur){const osc=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();osc.type='sine';osc.frequency.value=freq;f.type='lowpass';f.frequency.value=280;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+0.05);g.gain.setValueAtTime(0.1,t+dur*0.6);g.gain.linearRampToValueAtTime(0,t+dur);osc.connect(f);f.connect(g);g.connect(ctx.destination);osc.start(t);osc.stop(t+dur+0.1);musicNodes.push(osc,g,f);}
function makeHihat(ctx,t,vol){const buf=ctx.createBuffer(1,ctx.sampleRate*0.05,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3);const src=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();src.buffer=buf;f.type='highpass';f.frequency.value=7000;g.gain.value=vol;src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(t);musicNodes.push(src,g,f);}
function scheduleMusic(){if(!musicPlaying)return;const ctx=getACtx(),loopDur=chords.length*CHORD_DUR,t=ctx.currentTime+0.05;chords.forEach((chord,ci)=>{const cs=t+ci*CHORD_DUR;chord.forEach(freq=>makePad(ctx,freq,cs,CHORD_DUR+0.8,0.032));makeBass(ctx,bass[ci],cs,CHORD_DUR*0.7);makeHihat(ctx,cs,0.02);makeHihat(ctx,cs+CHORD_DUR*0.5,0.012);});musicScheduler=setTimeout(scheduleMusic,(loopDur-0.5)*1000);}
function startMusic(){if(musicPlaying||!soundEnabled)return;if(audioCtx)audioCtx.resume();musicPlaying=true;scheduleMusic();}
function stopMusic(){musicPlaying=false;if(musicScheduler){clearTimeout(musicScheduler);musicScheduler=null;}musicNodes=[];if(audioCtx)audioCtx.suspend();}
function playSpinSound(){if(!soundEnabled)return;try{const ctx=getACtx(),osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(200,ctx.currentTime);osc.frequency.linearRampToValueAtTime(80,ctx.currentTime+3.5);g.gain.setValueAtTime(0.08,ctx.currentTime);g.gain.linearRampToValueAtTime(0.001,ctx.currentTime+3.5);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+3.6);}catch(e){}}
function playWinSound(){if(!soundEnabled)return;try{const ctx=getACtx();[523,659,784].forEach((f,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='triangle';osc.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime+i*0.06);g.gain.linearRampToValueAtTime(0.1,ctx.currentTime+i*0.06+0.05);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.06+0.5);osc.connect(g);g.connect(ctx.destination);osc.start(ctx.currentTime+i*0.06);osc.stop(ctx.currentTime+i*0.06+0.6);});}catch(e){}}

function onSoundToggle(enabled) {
  soundEnabled = enabled;
  document.getElementById('sound-label').textContent = soundLabel();
  if (!enabled) stopMusic(); else startMusic();
}

updateBalanceUI();
spinning = false;
</script>
