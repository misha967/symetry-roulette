<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Roulette — Symetry</title>
<script src="roulette-math.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --border: #2a2a2a;
    --silver: #c0c0c0;
    --silver-dim: #888888;
    --gold: #d4af37;
    --red: #c0392b;
    --green: #27ae60;
    --text: #e0e0e0;
    --chip1: #e74c3c;
    --chip5: #3498db;
    --chip10: #2ecc71;
    --chip25: #9b59b6;
    --chip100: #f39c12;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .logo {
    font-size: 1.1rem;
    letter-spacing: 4px;
    color: var(--silver);
    text-transform: uppercase;
  }

  .balance-display {
    font-size: 1rem;
    color: var(--silver);
    letter-spacing: 1px;
  }

  .balance-display span {
    color: var(--gold);
    font-weight: bold;
  }

  /* ── MAIN LAYOUT ── */
  .game-wrap {
    width: 100%;
    max-width: 1100px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* ── WHEEL ── */
  .wheel-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #wheelCanvas {
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(192,192,192,0.15), 0 0 80px rgba(0,0,0,0.8);
  }

  .result-display {
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1rem;
    color: var(--silver-dim);
    letter-spacing: 2px;
  }

  .result-number {
    font-size: 2rem;
    font-weight: bold;
    min-width: 56px;
    text-align: center;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--border);
  }

  .result-number.red { background: var(--red); color: #fff; border-color: var(--red); }
  .result-number.black { background: #1a1a1a; color: #fff; border-color: #444; }
  .result-number.green { background: var(--green); color: #fff; border-color: var(--green); }

  .win-msg {
    color: var(--gold);
    font-size: 1rem;
    letter-spacing: 2px;
    min-height: 24px;
    text-align: center;
  }

  /* ── CHIPS ── */
  .chips-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chip {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 3px dashed rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    user-select: none;
    color: #fff;
  }

  .chip:hover { transform: scale(1.1); }
  .chip.active { transform: scale(1.15); box-shadow: 0 0 16px rgba(255,255,255,0.4); border-style: solid; }

  .chip[data-value="1"]   { background: var(--chip1); }
  .chip[data-value="5"]   { background: var(--chip5); }
  .chip[data-value="10"]  { background: var(--chip10); }
  .chip[data-value="25"]  { background: var(--chip25); }
  .chip[data-value="100"] { background: var(--chip100); }

  /* ── TABLE DE PARIS ── */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .betting-table {
    min-width: 420px;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* Ligne zéro */
  .zero-row {
    display: grid;
    grid-template-columns: 1fr;
  }

  /* Grille principale 3 lignes × 12 colonnes */
  .numbers-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
  }

  /* Lignes outside bets */
  .outside-col {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }

  .outside-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
  }

  .bet-cell {
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    transition: background 0.15s, transform 0.1s;
    position: relative;
    min-height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .bet-cell:hover { background: #2a2a2a; transform: scale(1.02); }
  .bet-cell:active { transform: scale(0.97); }

  .bet-cell.red-cell { color: #ff6b6b; border-color: #c0392b33; }
  .bet-cell.black-cell { color: var(--silver); }
  .bet-cell.green-cell { color: #2ecc71; border-color: #27ae6033; }
  .bet-cell.outside { color: var(--silver-dim); font-size: 0.7rem; }

  .bet-cell.zero-cell {
    background: #0d2b1a;
    color: #2ecc71;
    min-height: 36px;
    font-size: 1rem;
  }

  /* Jetons posés sur les cellules */
  .cell-chips {
    font-size: 0.65rem;
    color: var(--gold);
    margin-top: 2px;
  }

  /* ── ACTIONS ── */
  .actions-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-spin {
    background: linear-gradient(135deg, #c0c0c0, #808080);
    color: #000;
    min-width: 160px;
  }

  .btn-clear {
    background: transparent;
    color: var(--silver-dim);
    border: 1px solid var(--border);
  }

  .btn-repeat {
    background: transparent;
    color: var(--silver-dim);
    border: 1px solid var(--border);
  }

  .total-bet {
    color: var(--silver-dim);
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  .total-bet span { color: var(--gold); }

  /* ── HISTORIQUE ── */
  .history-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 32px;
  }

  .hist-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: bold;
    color: #fff;
  }

  .hist-num.red { background: var(--red); }
  .hist-num.black { background: #333; }
  .hist-num.green { background: var(--green); }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .bet-cell { padding: 5px 2px; min-height: 32px; font-size: 0.65rem; }
    .chip { width: 44px; height: 44px; font-size: 0.75rem; }
    .btn { padding: 10px 18px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Symetry</div>
  <div class="balance-display">Balance : <span id="balanceVal">1000</span> €</div>
</header>

<div class="game-wrap">

  <!-- WHEEL -->
  <div class="wheel-section">
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
    <div class="result-display">
      <div class="result-number" id="resultNum">—</div>
      <div id="resultLabel" style="color:var(--silver-dim); letter-spacing:2px; font-size:0.85rem;"></div>
    </div>
    <div class="win-msg" id="winMsg"></div>
  </div>

  <!-- HISTORIQUE -->
  <div class="history-row" id="historyRow"></div>

  <!-- CHIPS -->
  <div class="chips-row">
    <div class="chip" data-value="1">1</div>
    <div class="chip" data-value="5">5</div>
    <div class="chip" data-value="10">10</div>
    <div class="chip" data-value="25">25</div>
    <div class="chip" data-value="100">100</div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <div class="betting-table" id="bettingTable"></div>
  </div>

  <!-- TOTAL BET + ACTIONS -->
  <div class="total-bet">Mise totale : <span id="totalBetVal">0</span> €</div>
  <div class="actions-row">
    <button class="btn btn-clear" id="btnClear">Effacer</button>
    <button class="btn btn-spin" id="btnSpin">Lancer</button>
    <button class="btn btn-repeat" id="btnRepeat">Répéter</button>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let balance = 1000;
let selectedChip = 1;
let bets = {}; // key -> { type, numbers, amount }
let lastBets = {};
let spinning = false;
let history = [];

// ═══════════════════════════════════════════
// WHEEL DRAWING
// ═══════════════════════════════════════════
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const CX = 150, CY = 150, R = 145;
const NUMBERS = [
  0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36,
  11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9,
  22, 18, 29, 7, 28, 12, 35, 3, 26
];
const RED_NUMS = [1,3,5,7,9,12,14,16,18,21,23,25,27,30,32,34,36];

let wheelAngle = 0;
let ballAngle = 0;
let ballR = 125;
let animId = null;

function segColor(n) {
  if (n === 0) return '#1a5c2e';
  return RED_NUMS.includes(n) ? '#8b1a1a' : '#1a1a1a';
}

function drawWheel(wAngle, bAngle, bRadius) {
  ctx.clearRect(0, 0, 300, 300);

  const segCount = NUMBERS.length; // 37
  const segAngle = (2 * Math.PI) / segCount;

  // Fond
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.fillStyle = '#111';
  ctx.fill();

  // Segments
  for (let i = 0; i < segCount; i++) {
    const start = wAngle + i * segAngle - Math.PI / 2;
    const end = start + segAngle;
    const n = NUMBERS[i];

    // Secteur
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R - 2, start, end);
    ctx.closePath();
    ctx.fillStyle = segColor(n);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Numéro — proche du bord
    const textR = R - 14;
    const midAngle = start + segAngle / 2;
    const tx = CX + textR * Math.cos(midAngle);
    const ty = CY + textR * Math.sin(midAngle);

    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(midAngle + Math.PI / 2);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${segCount > 20 ? '8px' : '10px'} sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n, 0, 0);
    ctx.restore();
  }

  // Cercle intérieur (bol)
  ctx.beginPath();
  ctx.arc(CX, CY, R * 0.38, 0, 2 * Math.PI);
  ctx.fillStyle = '#0d0d0d';
  ctx.fill();
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Bille
  const bx = CX + bRadius * Math.cos(bAngle);
  const by = CY + bRadius * Math.sin(bAngle);

  ctx.beginPath();
  ctx.arc(bx, by, 6, 0, 2 * Math.PI);
  const grad = ctx.createRadialGradient(bx - 2, by - 2, 1, bx, by, 6);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#aaaaaa');
  ctx.fillStyle = grad;
  ctx.fill();

  // Centre logo
  ctx.beginPath();
  ctx.arc(CX, CY, 18, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#888';
  ctx.font = 'bold 7px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SYM', CX, CY);
}

drawWheel(0, 0, ballR);

// ═══════════════════════════════════════════
// SPIN ANIMATION
// ═══════════════════════════════════════════
function doSpin(targetNumber, onDone) {
  const segCount = NUMBERS.length;
  const segAngle = (2 * Math.PI) / segCount;
  const targetIdx = NUMBERS.indexOf(targetNumber);

  // Angle cible de la roue : amène targetIdx sous le pointeur (haut = -PI/2)
  const targetWheelAngle = -(targetIdx * segAngle + segAngle / 2);

  // Rotations totales roue
  const fullRotations = 5 + Math.random() * 3; // 5-8 tours
  const finalWheelAngle = targetWheelAngle - fullRotations * 2 * Math.PI;

  const startWheelAngle = wheelAngle;
  const startBallAngle = ballAngle;

  // Bille : tourne vite dans l'autre sens, puis ralentit et spirale vers le centre
  const ballSpins = 8 + Math.random() * 4;
  const finalBallAngle = startBallAngle - ballSpins * 2 * Math.PI;

  const duration = 5000; // ms
  let startTime = null;

  function ease(t) {
    // Accélération légère puis décélération forte
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function frame(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const rawT = Math.min(elapsed / duration, 1);
    const t = ease(rawT);

    // Roue tourne dans le sens horaire
    wheelAngle = startWheelAngle + (finalWheelAngle - startWheelAngle) * t;

    // Bille : tourne vite au début (bord), spirale vers l'intérieur à la fin
    ballAngle = startBallAngle + (finalBallAngle - startBallAngle) * t;

    // Rayon bille : commence à 128, descend à ~90 dans les derniers 20%
    if (rawT < 0.75) {
      ballR = 128;
    } else {
      const p = (rawT - 0.75) / 0.25; // 0→1 dans les 25% finaux
      ballR = 128 - p * 35; // 128 → 93
    }

    drawWheel(wheelAngle, ballAngle, ballR);

    if (rawT < 1) {
      animId = requestAnimationFrame(frame);
    } else {
      wheelAngle = targetWheelAngle;
      ballR = 93;
      drawWheel(wheelAngle, ballAngle, ballR);
      onDone();
    }
  }

  animId = requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════
// BETTING TABLE
// ═══════════════════════════════════════════
function buildTable() {
  const table = document.getElementById('bettingTable');
  table.innerHTML = '';

  // — ZÉRO —
  const zeroRow = document.createElement('div');
  zeroRow.className = 'zero-row';
  zeroRow.appendChild(makeCell('0', 'straight-0', 'straight', [0], 'zero-cell green-cell'));
  table.appendChild(zeroRow);

  // — NUMÉROS 1–36 (3 lignes × 12 colonnes) —
  // Ordre : ligne du haut = 3,6,9...36 / milieu = 2,5,8...35 / bas = 1,4,7...34
  const grid = document.createElement('div');
  grid.className = 'numbers-grid';

  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 12; col++) {
      // Rangée 0 (haut) = n%3===0, rangée 1 = n%3===2, rangée 2 = n%3===1
      const n = col * 3 + (3 - row);
      const color = RED_NUMS.includes(n) ? 'red-cell' : 'black-cell';
      grid.appendChild(makeCell(n, `straight-${n}`, 'straight', [n], color));
    }
  }
  table.appendChild(grid);

  // — COLONNES (2 à 1) à droite — on les ajoute en colonne supplémentaire via flex
  // Pour simplifier, on les met sous la grille en ligne
  const colRow = document.createElement('div');
  colRow.className = 'outside-col';
  // Col 3 = 3,6,...36 ; Col 2 = 2,5,...35 ; Col 1 = 1,4,...34
  colRow.appendChild(makeCell('Col 3', 'col3', 'column', Array.from({length:12},(_,i)=>(i+1)*3), 'outside'));
  colRow.appendChild(makeCell('Col 2', 'col2', 'column', Array.from({length:12},(_,i)=>i*3+2), 'outside'));
  colRow.appendChild(makeCell('Col 1', 'col1', 'column', Array.from({length:12},(_,i)=>i*3+1), 'outside'));
  table.appendChild(colRow);

  // — DOUZAINES —
  const dozRow = document.createElement('div');
  dozRow.className = 'outside-col';
  dozRow.appendChild(makeCell('1–12', 'doz1', 'dozen', range(1,12), 'outside'));
  dozRow.appendChild(makeCell('13–24', 'doz2', 'dozen', range(13,24), 'outside'));
  dozRow.appendChild(makeCell('25–36', 'doz3', 'dozen', range(25,36), 'outside'));
  table.appendChild(dozRow);

  // — PARIS SIMPLES —
  const outsideRow = document.createElement('div');
  outsideRow.className = 'outside-row';
  outsideRow.appendChild(makeCell('1–18', 'low', 'low', range(1,18), 'outside'));
  outsideRow.appendChild(makeCell('PAIR', 'even', 'even', range(2,36,2), 'outside'));
  outsideRow.appendChild(makeCell('●', 'red', 'red', [], 'outside red-cell'));
  outsideRow.appendChild(makeCell('●', 'black', 'black', [], 'outside black-cell'));
  outsideRow.appendChild(makeCell('IMPAIR', 'odd', 'odd', range(1,35,2), 'outside'));
  outsideRow.appendChild(makeCell('19–36', 'high', 'high', range(19,36), 'outside'));
  table.appendChild(outsideRow);
}

function makeCell(label, key, type, numbers, extraClass) {
  const cell = document.createElement('div');
  cell.className = `bet-cell ${extraClass}`;
  cell.dataset.key = key;
  cell.dataset.type = type;
  cell.dataset.numbers = JSON.stringify(numbers);

  const labelEl = document.createElement('span');
  labelEl.textContent = label;
  cell.appendChild(labelEl);

  const chipsEl = document.createElement('div');
  chipsEl.className = 'cell-chips';
  chipsEl.id = `chips-${key}`;
  cell.appendChild(chipsEl);

  cell.addEventListener('click', () => placeBet(key, type, numbers));
  return cell;
}

function range(a, b, step = 1) {
  const arr = [];
  for (let i = a; i <= b; i += step) arr.push(i);
  return arr;
}

// ═══════════════════════════════════════════
// BETS LOGIC
// ═══════════════════════════════════════════
function placeBet(key, type, numbers) {
  if (spinning) return;
  const cost = selectedChip;
  if (balance < cost) return;

  balance -= cost;
  updateBalance();

  if (!bets[key]) {
    bets[key] = { type, numbers, amount: 0 };
  }
  bets[key].amount += cost;

  updateCellChips(key);
  updateTotalBet();
}

function updateCellChips(key) {
  const el = document.getElementById(`chips-${key}`);
  if (!el) return;
  const amount = bets[key]?.amount || 0;
  el.textContent = amount > 0 ? `${amount}€` : '';
}

function updateTotalBet() {
  const total = Object.values(bets).reduce((s, b) => s + b.amount, 0);
  document.getElementById('totalBetVal').textContent = total;
}

function clearBets(refund = true) {
  if (refund) {
    const total = Object.values(bets).reduce((s, b) => s + b.amount, 0);
    balance += total;
    updateBalance();
  }
  bets = {};
  document.querySelectorAll('.cell-chips').forEach(el => el.textContent = '');
  updateTotalBet();
}

// ═══════════════════════════════════════════
// SPIN
// ═══════════════════════════════════════════
document.getElementById('btnSpin').addEventListener('click', () => {
  if (spinning) return;
  const total = Object.values(bets).reduce((s, b) => s + b.amount, 0);
  if (total === 0) return;

  spinning = true;
  document.getElementById('btnSpin').disabled = true;
  document.getElementById('winMsg').textContent = '';
  document.getElementById('resultLabel').textContent = '';

  const result = spinResult();
  lastBets = JSON.parse(JSON.stringify(bets));

  doSpin(result, () => {
    spinning = false;
    document.getElementById('btnSpin').disabled = false;

    // Afficher résultat
    const color = getColor(result);
    const numEl = document.getElementById('resultNum');
    numEl.textContent = result;
    numEl.className = `result-number ${color}`;

    const label = color === 'green' ? 'ZÉRO' : (color === 'red' ? 'ROUGE' : 'NOIR');
    document.getElementById('resultLabel').textContent = label;

    // Calculer gains
    const betsList = Object.values(bets);
    const win = resolveBets(betsList, result);

    // Rembourser les mises dans le calcul de resolveBets, donc balance += win
    balance += win;
    updateBalance();

    if (win > 0) {
      const profit = win - betsList.reduce((s,b)=>s+b.amount,0);
      document.getElementById('winMsg').textContent = `✦ GAGNÉ ${win} € ✦`;
    } else {
      document.getElementById('winMsg').textContent = 'Pas de gain';
    }

    addHistory(result, color);
    clearBets(false);
  });
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (!spinning) clearBets(true);
});

document.getElementById('btnRepeat').addEventListener('click', () => {
  if (spinning) return;
  clearBets(true);
  const cost = Object.values(lastBets).reduce((s,b)=>s+b.amount,0);
  if (cost > balance) return;
  bets = JSON.parse(JSON.stringify(lastBets));
  balance -= cost;
  updateBalance();
  Object.keys(bets).forEach(k => updateCellChips(k));
  updateTotalBet();
});

// ═══════════════════════════════════════════
// CHIPS SELECTION
// ═══════════════════════════════════════════
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    selectedChip = parseInt(chip.dataset.value);
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  });
});
document.querySelector('.chip[data-value="1"]').classList.add('active');

// HISTORY
// ═══════════════════════════════════════════
function addHistory(n, color) {
  history.unshift({ n, color });
  if (history.length > 15) history.pop();
  const row = document.getElementById('historyRow');
  row.innerHTML = '';
  history.forEach(h => {
    const el = document.createElement('div');
    el.className = `hist-num ${h.color}`;
    el.textContent = h.n;
    row.appendChild(el);
  });
}
